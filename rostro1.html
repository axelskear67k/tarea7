
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máscara facial</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
  
  <script>
    //Objetos
    let faceMesh  //Modelo
    let video     //Camara
    let faces = []

    let options = {
      maxFaces: 1,
      refineLandmarks: false,
      flipped: false
    }

    let uvMapImage
    let triangulation
    let uvCoords

    //Configuracion
    async function setup(){

      faceMesh = await ml5.faceMesh(options)

      uvMapImage = await loadImage("./images/mascara1.jpg")

      createCanvas(640, 480, WEBGL)

      video = createCapture(VIDEO)
      video.size(640, 480)
      video.hide()

      //Iniciar la deteccion
      faceMesh.detectStart(video, gotFaces)

      //Identificacion del mapa de coordenadas
      triangulation = faceMesh.getTriangles()
      uvCoords = faceMesh.getUVCoords()
    }

    //Renderizado
    function draw(){

      //Invertir imagen y mostrar camara
      //background(50)

      push()
      translate(-width/2, -height/2)

      image(video, 0, 0, width, height)

      //Iterar los rostros
      for (let i = 0; i < faces.length; i++){

        let face = faces[i]

        //Configuracion del render
        noStroke()
        texture(uvMapImage)
        textureMode(NORMAL)
        beginShape(TRIANGLES)

        //Ubicacion de cada punto del rostro
        for (let j = 0; j < triangulation.length; j++){

          let indexA = triangulation[j][0]
          let indexB = triangulation[j][1]
          let indexC = triangulation[j][2]

          let a = face.keypoints[indexA]
          let b = face.keypoints[indexB]
          let c = face.keypoints[indexC]

          let uvA = {
            x: uvCoords[indexA][0],
            y: uvCoords[indexA][1]
          }

          let uvB = {
            x: uvCoords[indexB][0],
            y: uvCoords[indexB][1]
          }

          let uvC = {
            x: uvCoords[indexC][0],
            y: uvCoords[indexC][1]
          }

          vertex(a.x, a.y, uvA.x, uvA.y)
          vertex(b.x, b.y, uvB.x, uvB.y)
          vertex(c.x, c.y, uvC.x, uvC.y)
        }

        endShape()
      }

      pop()
    }

    //Resultado
    function gotFaces(results){
      faces = results
    }

  </script>

</body>
</html>
