
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconocimiento con IA</title>

  <style>
    body {
      background: #172554;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    canvas {
      border: 3px solid #38bdf8;
      border-radius: 12px;
      max-width: 95%;
      height: auto;
    }
    .caja {
      background: #1e293b;
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
    }
    .barra {
      background: #475569;
      border-radius: 10px;
      margin: 8px 0 15px;
      overflow: hidden;
    }
    .progreso {
      background: #22c55e;
      height: 15px;
      transition: width .3s;
    }
    button {
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🤖 Reconocimiento de Objetos</h1>
  <p>Inteligencia Artificial - Teachable Machine</p>

  <div class="caja">
    <div id="camara"></div>

    <h2 id="objeto">Esperando objeto...</h2>

    <h3>📊 Porcentajes</h3>
    <div id="resultados"></div>

    <button onclick="activarVoz()">🔊 Activar voz</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js"></script>

  <script>
    let classifier;
    let imageModelURL = '../modelo_nuevo/';
    let video, flippedVideo;
    let label = "";
    let voz = false;
    let ultimoObjeto = "";

    function preload() {
      classifier = ml5.imageClassifier(imageModelURL + 'model.json');
    }

    function setup() {
      let canvas = createCanvas(320, 240);
      canvas.parent("camara");

      video = createCapture(VIDEO);
      video.size(320, 240);
      video.hide();

      classifyVideo();
    }

    function draw() {
      background(0);
      image(video, 0, 0);
    }

    function classifyVideo() {
      flippedVideo = ml5.flipImage(video);
      classifier.classify(flippedVideo, gotResult);
    }

    function gotResult(error, results) {
      if (flippedVideo) flippedVideo.remove();

      if (error) {
        console.error(error);
        setTimeout(classifyVideo, 500);
        return;
      }

      if (results && results.length > 0) {
        label = results[0].label;

        document.getElementById("objeto").textContent =
          "Objeto: " + label;

        let html = "";

        results.forEach(r => {
          let porcentaje = (r.confidence * 100).toFixed(1);

          html += `
            <div style="text-align:left">
              ${r.label}: ${porcentaje}%
              <div class="barra">
                <div class="progreso"
                     style="width:${porcentaje}%"></div>
              </div>
            </div>
          `;
        });

        document.getElementById("resultados").innerHTML = html;

        // Decir el nombre del objeto
        if (voz && results[0].confidence > 0.85 &&
            label !== ultimoObjeto) {

          let mensaje = new SpeechSynthesisUtterance(
            "El objeto es " + label
          );

          mensaje.lang = "es-PE";
          speechSynthesis.speak(mensaje);

          ultimoObjeto = label;
        }
      }

      classifyVideo();
    }

    function activarVoz() {
      voz = true;
      ultimoObjeto = "";
      speechSynthesis.cancel();
      alert("Voz activada");
    }
  </script>

</body>
</html>
