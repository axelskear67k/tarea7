
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identificando mano</title>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100vh;
    }
    h1 { margin-top: 35px; color: #38bdf8; }
    p { color: #cbd5e1; }
    canvas {
      border: 4px solid #38bdf8;
      border-radius: 18px;
      box-shadow: 0 0 30px #0284c7;
      margin-top: 20px;
      max-width: 90%;
      height: auto;
    }
    .info {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      max-width: 600px;
      margin: 25px auto;
    }
  </style>
</head>

<body>

  <h1>🤖 Reconocimiento de Manos</h1>
  <p>Inteligencia Artificial con ml5.js</p>

  <div class="info">
    ✋ Coloca tu mano frente a la cámara.
    El punto rojo seguirá tu dedo índice.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <script>
    //Paso 1 (objetos y variables)
    let handPose
    let video
    let hands = []

    //Paso 2 - Configuración
    async function setup(){

      handPose = await ml5.handPose()

      createCanvas(640, 480)

      //Acceder a la cámara
      video = createCapture(VIDEO)
      video.size(640, 480)
      video.hide()

      //Iniciar la detección
      handPose.detectStart(video, gotHands)
    }

    //Paso 3 - Renderizado (dibujar)
    function draw(){

      //Mostrar video
      image(video, 0, 0, width, height)

      //Detectar la primera mano
      if (hands.length > 0){

        let hand = hands[0]

        //Punta del dedo índice
        let indice = hand.keypoints[8]

        //Dibujar círculo
        fill(255, 0, 0)
        noStroke()
        circle(indice.x, indice.y, 30)

      }
    }

    //Paso 4 - gotHands (resultado)
    function gotHands(results){

      hands = results

    }
  </script>
</body>
</html>
