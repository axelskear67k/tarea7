
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linea entre indices</title>
  </head>
  <body>

    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <script>
      //Paso 1 (objetos y variables)
      let handPose
      let video
      let hands = []
      let connections

      //Paso 2 - Configuración
      async function setup(){

        handPose = await ml5.handPose()

        createCanvas(640, 480)

        video = createCapture(VIDEO)
        video.size(640, 480)
        video.hide()

        //Iniciar la detección
        handPose.detectStart(video, gotHands)
        connections = handPose.getConnections()
      }

      //Paso 3 - Renderizado (dibujar)
      function draw(){

        //Pintar el vídeo
        image(video, 0, 0, width, height)

        //Detectar las dos manos
        if (hands.length >= 2){

          //Identificar las manos
          let mano1 = hands[0]
          let mano2 = hands[1]

          //Identificar la punta de los índices
          let indice1 = mano1.keypoints[8]
          let indice2 = mano2.keypoints[8]

          //Dibujar línea entre los índices
          stroke(255, 0, 0)
          strokeWeight(4)
          line(indice1.x, indice1.y, indice2.x, indice2.y)

          //Dibujar puntos en los índices
          fill(0, 255, 0)
          noStroke()
          circle(indice1.x, indice1.y, 12)
          circle(indice2.x, indice2.y, 12)

        }
      }

      //Paso 4 - gotHands (resultado)
      function gotHands(results){

        hands = results

      }

    </script>
  </body>
</html>
