
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identificando mano</title>
  </head>
  <body>

    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <script>
      //Paso 1 (objetos y variables)
      let handPose
      let video
      let hands = []

      //Paso 2 - Configuración
      async function setup(){

        handPose = await ml5.handPose()

        createCanvas(640, 480)

        //Acceder a la cámara
        video = createCapture(VIDEO)
        video.size(640, 480)
        video.hide()

        //Iniciar la detección
        handPose.detectStart(video, gotHands)
      }

      //Paso 3 - Renderizado (dibujar)
      function draw(){

        //Mostrar video
        image(video, 0, 0, width, height)

        //Detectar la primera mano
        if (hands.length > 0){

          let hand = hands[0]

          //Punta del dedo índice
          let indice = hand.keypoints[8]

          //Dibujar círculo
          fill(255, 0, 0)
          noStroke()
          circle(indice.x, indice.y, 30)

        }
      }

      //Paso 4 - gotHands (resultado)
      function gotHands(results){

        hands = results

      }

    </script>
  </body>
</html>
