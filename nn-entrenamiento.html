<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

  <script>
    //Paso 1: arreglo para cada grupo de imagenes
    let circles = []
    let squares = []
    let triangles = []
    let shapeClassifier

    //Paso 2: Carga de las imagenes
    function preload(){
      for(let i = 0; i < 100; i++){
        let index = nf((i+1), 3, 0)

        circles[i] = loadImage(`data/circles${index}.png`)
        squares[i] = loadImage(`data/squares${index}.png`)
        triangles[i] = loadImage(`data/triangles${index}.png`)
      }
    }

    function setup(){
      let options = {
        inputs: [64, 64, 4],
        task: "imageClassification",
        debug: true
      }

      //Inicializamos la red neuronal
      shapeClassifier = ml5.neuralNetwork(options)

      //Datos de entrenamiento
      for (let i = 0; i < 100; i++){
        //Agregar: Circulos
        shapeClassifier.addData({image:circles[i]}, {label: 'Circulo'})

        //Agregar: Cuadrados
        shapeClassifier.addData({image:squares[i]}, {label: 'Cuadrado'})

        //Agregar: Triangulos
        shapeClassifier.addData({image:triangles[i]}, {label: 'Triangulo'})
      }

      //Normalizacion
      shapeClassifier.normalizeData()
      shapeClassifier.train({epoch})
    }

    //Cuando finalice el entrenamiento, guardamos: 2 (JSON), 1(BIN)
    function finishedTraining(){
      console.log("Entrenamiento finalizado")
      shapeClassifier.save() // se descargan 3 archivos
    }
  </script>
</body>
</html>
